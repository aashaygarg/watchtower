[project]
name = "watchtower"
version = "0.1.0"
description = "Watchtower — a local-first AI Founder Operating System (internal CLI)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Watchtower" }]
dependencies = [
    "langgraph>=0.2",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.optional-dependencies]
# Live research via GPT-Researcher. Optional: without it, the research service
# degrades gracefully to the placeholder. Install with `uv sync --extra research`.
research = ["gpt-researcher>=0.8"]
# LLM providers. The OpenAI SDK ships in the core dependencies; these are only
# needed for the corresponding provider (config.llm.provider).
ollama = ["ollama>=0.3"]
anthropic = ["anthropic>=0.39"]
gemini = ["google-genai>=0.3"]

[project.scripts]
watchtower = "watchtower.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watchtower"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["watchtower", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
# Typer relies on function calls in argument defaults; treat them as immutable.
extend-immutable-calls = ["typer.Option", "typer.Argument", "pathlib.Path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
