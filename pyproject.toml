[project]
name = "watchtower"
version = "0.1.0"
description = "Watchtower — a local-first AI Founder Operating System (internal CLI)."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Watchtower" }]
dependencies = [
    "langgraph>=0.2",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "rich>=13.7",
]

[project.scripts]
watchtower = "watchtower.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watchtower"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["watchtower", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
