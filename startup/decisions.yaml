# decisions.yaml - the record of choices Health OS has made.
#
# Each item maps to watchtower.startup.models.Decision.
# Schema:
#   id:                 required. Stable unique identifier (string).
#   title:              required. Short statement of what was decided.
#   context:            optional. The situation that prompted the decision.
#   options_considered: optional. List of alternatives that were weighed.
#   chosen_option:      optional. The option that was selected.
#   rationale:          optional. Why the chosen option was preferred.
#   status:             optional. One of: proposed, accepted, rejected,
#                       superseded, revisited. Defaults to "proposed".
#   reversible:         optional. true or false. Defaults to true.
#   goal_id:            optional. id of a related goal.
#   strategy_id:        optional. id of a related strategy.
#   hypothesis_id:      optional. id of a related hypothesis.
#   tags:               optional. List of free-form labels.
#
# This file is optional and may be left empty (decisions: []) or deleted.
# TODO(founder): Replace the EXAMPLE entry below with your real decisions.

decisions:
  - id: initial-product-direction
    title: Use Biological Age as the initial product entry point
    context: >
      Health OS requires a simple, compelling way to introduce users to a broader
      long-term vision.
    options_considered:
      - Nutrition tracking
      - Workout planning
      - Biological Age
    chosen_option: Biological Age
    rationale: >
      Biological Age is differentiated, emotionally engaging, and naturally leads
      into the broader Health OS platform.
    status: accepted
    reversible: true
    goal_id: validate-initial-wedge
    strategy_id: biological-age-wedge
    tags:
      - mvp
      - strategy
