# hypotheses.yaml - the testable beliefs Health OS is betting on.
#
# Each item maps to watchtower.startup.models.Hypothesis.
# Schema:
#   id:          required. Stable unique identifier (string).
#   statement:   required. The belief expressed as a falsifiable statement.
#   strategy_id: optional. id of the strategy this hypothesis supports.
#   status:      optional. One of: untested, testing, supported, refuted,
#                inconclusive. Defaults to "untested".
#   confidence:  optional. Number from 0.0 to 1.0. Defaults to 0.5.
#   rationale:   optional. Why you believe this, or why it is worth testing.
#   tags:        optional. List of free-form labels.
#
# This file is optional and may be left empty (hypotheses: []) or deleted.
# TODO(founder): Replace the EXAMPLE entry below with your real hypotheses.

hypotheses:
  - id: bio-age-interest
    statement: >
      Biological Age generates significantly higher user interest than generic
      health tracking.
    strategy_id: biological-age-wedge
    status: testing
    confidence: 0.65
    rationale: >
      Biological Age is simple, emotionally engaging, and easy to understand.
    tags:
      - acquisition

  - id: bio-age-shareability
    statement: >
      Users are willing to share their Biological Age results with others.
    strategy_id: biological-age-wedge
    status: untested
    confidence: 0.50
    rationale: >
      Social sharing could become a low-cost acquisition channel.
    tags:
      - virality

  - id: personalized-insights
    statement: >
      Users return weekly when provided with personalized AI-generated health insights.
    strategy_id: personalized-ai
    status: untested
    confidence: 0.35
    rationale: >
      Continuous value should drive long-term engagement.
    tags:
      - retention
