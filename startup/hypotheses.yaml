# hypotheses.yaml - the testable beliefs Health OS is betting on.
#
# Each item maps to watchtower.startup.models.Hypothesis.
# Schema:
#   id:          required. Stable unique identifier (string).
#   statement:   required. The belief expressed as a falsifiable statement.
#   strategy_id: optional. id of the strategy this hypothesis supports.
#   status:      optional. One of: untested, testing, supported, refuted,
#                inconclusive. Defaults to "untested".
#   confidence:  optional. Number from 0.0 to 1.0. Defaults to 0.5.
#   rationale:   optional. Why you believe this, or why it is worth testing.
#   tags:        optional. List of free-form labels.
#
# This file is optional and may be left empty (hypotheses: []) or deleted.
# TODO(founder): Replace the EXAMPLE entry below with your real hypotheses.

