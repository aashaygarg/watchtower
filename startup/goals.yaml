# goals.yaml - the outcomes Health OS is trying to reach.
#
# Each item maps to watchtower.startup.models.Goal.
# Schema:
#   id:             required. Stable unique identifier (string).
#   title:          required. Short statement of the desired outcome.
#   description:    optional. Longer explanation of the goal.
#   status:         optional. One of: proposed, active, achieved, blocked, abandoned.
#                   Defaults to "proposed".
#   target_metric:  optional. Name of the metric used to judge success.
#   target_value:   optional. Target value for the metric (quote it as a string).
#   parent_goal_id: optional. id of a parent goal, for sub-goals.
#   tags:           optional. List of free-form labels.
#
# This file is optional and may be left empty (goals: []) or deleted.
