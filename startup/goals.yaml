# goals.yaml - the outcomes Health OS is trying to reach.
#
# Each item maps to watchtower.startup.models.Goal.
# Schema:
#   id:             required. Stable unique identifier (string).
#   title:          required. Short statement of the desired outcome.
#   description:    optional. Longer explanation of the goal.
#   status:         optional. One of: proposed, active, achieved, blocked, abandoned.
#                   Defaults to "proposed".
#   target_metric:  optional. Name of the metric used to judge success.
#   target_value:   optional. Target value for the metric (quote it as a string).
#   parent_goal_id: optional. id of a parent goal, for sub-goals.
#   tags:           optional. List of free-form labels.
#
# This file is optional and may be left empty (goals: []) or deleted.
# TODO(founder): Replace the EXAMPLE entry below with your real goals.

goals:
  - id: validate-initial-wedge
    title: Validate the first compelling entry point for Health OS
    description: >
      Identify the first feature or workflow that users consistently find valuable
      enough to begin using Health OS.
    status: active
    target_metric: Weekly active users
    target_value: "100"
    tags:
      - mvp
      - validation

  - id: establish-user-retention
    title: Build a product users return to every week
    description: >
      Demonstrate that Health OS creates recurring value rather than one-time curiosity.
    status: proposed
    target_metric: Week 4 retention
    target_value: "30%"
    tags:
      - retention

  - id: validate-monetization
    title: Demonstrate willingness to pay
    description: >
      Validate that users are willing to pay for continuous personalized health guidance.
    status: proposed
    target_metric: Paid conversion
    target_value: "10%"
    tags:
      - revenue
