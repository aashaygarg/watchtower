name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # The boundary that defines Watchtower is defended automatically: this step
      # fails any PR whose kernel imports a forbidden module (an adapter, a
      # provider SDK, a web/DB framework, a YAML loader, or a UI toolkit) at
      # import time or transitively.
      - name: Architecture fitness
        run: uv run pytest tests/test_architecture.py -q

      - name: Full test suite
        run: uv run pytest -q
